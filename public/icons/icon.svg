<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Star / trophy accent -->
  <text x="256" y="200" font-family="Arial Black, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#fbbf24">🏆</text>
  <!-- NX text -->
  <text x="256" y="360" font-family="Arial Black, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="white" letter-spacing="-4">NX</text>
  <!-- Tagline -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#c7d2fe">Génie en Herbe</text>
</svg>
